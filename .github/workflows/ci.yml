name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, awk ${{ matrix.awk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: bash 5 + GNU 도구. 훅 파서가 쓰는 awk 구현(gawk·mawk)마다 한 번씩
          - os: ubuntu-latest
            awk: gawk
          - os: ubuntu-latest
            awk: mawk
          # macOS: /bin/bash 3.2 + Homebrew bash 5(run-all.sh 가 둘 다 실행) + BSD awk
          - os: macos-latest
            awk: bsd
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7

      - name: 테스트 환경 준비
        env:
          AWK_IMPL: ${{ matrix.awk }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gawk mawk >/dev/null
            # 이후 단계의 awk 를 matrix.awk 로 고정한다(PATH 맨 앞의 심 디렉터리)
            shim="$RUNNER_TEMP/awk-shim"
            mkdir -p "$shim"
            ln -sf "$(command -v "$AWK_IMPL")" "$shim/awk"
            echo "$shim" >> "$GITHUB_PATH"
          else
            # PATH 에 bash 5 를 두면 run-all.sh 가 훅·스킬 스위트를 /bin/bash(3.2)와 bash 5 로 두 번 실행한다
            brew install bash
          fi

      - name: 도구 버전
        run: |
          for b in /bin/bash $(type -ap bash); do printf '%s: ' "$b"; "$b" --version | head -n 1; done
          printf 'awk(%s): ' "$(command -v awk)"
          { awk --version 2>/dev/null | head -n 1 | grep . ; } || awk -W version 2>&1 | head -n 1
          python3 --version
          jq --version || echo 'jq 없음'
          git --version

      - name: 테스트 (tests/run-all.sh)
        run: bash tests/run-all.sh

      - name: 하네스 검증 (scripts/validate.sh --repo)
        run: bash scripts/validate.sh --repo --quiet

      - name: 비밀·개인정보 검사
        run: |
          hits=$(grep -rEn '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,})' \
            --exclude-dir=.git . | grep -vE 'noreply@anthropic\.com|example\.com' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo '비밀 키 또는 이메일로 보이는 문자열 발견 — 제거하거나 example.com 으로 바꿀 것'
            exit 1
          fi
          echo '비밀·이메일 없음'
