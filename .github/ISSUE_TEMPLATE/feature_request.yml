name: 기능 제안
description: 새 규칙·프로필·훅·옵션
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 풀고 싶은 문제
      description: 지금 무엇이 불편하거나 빠져 있는지. 겪은 상황을 적으면 좋다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떻게 동작하면 좋겠는지
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법이나 대안
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 훅
        - 규칙·에이전트·스킬
        - 설치(install.sh)
        - 프로젝트 템플릿·프로필(apply.sh)
        - 플러그인 배포판
        - 문서
        - 기타
